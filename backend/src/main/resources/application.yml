spring:
  application:
    name: dartnet-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dartnet}
    username: ${SPRING_DATASOURCE_USERNAME:dartnet}
    password: ${SPRING_DATASOURCE_PASSWORD:dartnet_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

ml-service:
  url: ${ML_SERVICE_URL:http://localhost:8000}
  timeout-seconds: 30

replay:
  default-speed: ${REPLAY_DEFAULT_SPEED:1}
  pcap-dir: ${PCAP_DATA_DIR:data/pcap}
  metrics-interval-ms: 1000

alert:
  id-prefix: ALT
  sequence-start: 1

# Detection thresholds — all configurable via env or override in application-prod.yml
detection:
  ddos:
    flow-rate-threshold: 100.0
    syn-ratio-threshold: 0.8
  port-scan:
    min-ports: 20
    min-hosts: 5
  dns:
    entropy-threshold: 3.5
    min-query-length: 20
  c2:
    periodicity-threshold: 0.7
  exfil:
    ratio-threshold: 10.0
  alert:
    min-confidence: 0.5

logging:
  level:
    com.dartnet: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
