version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: nexussoc-postgres
    environment:
      POSTGRES_DB: nexussoc
      POSTGRES_USER: nexussoc
      POSTGRES_PASSWORD: nexussoc_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexussoc"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: nexussoc-ml
    environment:
      MODEL_DIR: /app/models
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexussoc-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexussoc
      SPRING_DATASOURCE_USERNAME: nexussoc
      SPRING_DATASOURCE_PASSWORD: nexussoc_secret
      ML_SERVICE_URL: http://ml-service:8000
      PCAP_DATA_DIR: /app/data/pcap
      MODEL_DIR: /app/models
      REPLAY_DEFAULT_SPEED: 1
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_WS_BASE_URL: ws://localhost:8080
        VITE_DATA_MODE: api
    container_name: nexussoc-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
